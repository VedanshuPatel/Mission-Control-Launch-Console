[project]
name = "mission-control"
version = "0.1.0"
description = "Mission Control Go/No-Go Launch Console"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "sqlalchemy",
    "pydantic",
    "pydantic-settings",
    "google-genai",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-socket",
    "httpx",
    "ruff",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
addopts = "--disable-socket --allow-unix-socket -q"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
